# Generic npm release - copy as-is between packages.
#
# Release: bump "version" in package.json on the default branch, then push a matching tag:
#   git tag v1.2.3 && git push origin v1.2.3
# Prereleases (e.g. v1.2.3-beta.1) are published under the "beta" dist-tag instead of "latest".
#
# One-time setup per package (see the "Releasing" notes in the repo):
#   - the package has to exist on npm before trusted publishing can be configured,
#     so the very first version is published manually
#   - npm package settings -> Trusted publisher -> GitHub Actions:
#     this repo, workflow filename "release.yml", environment "npm"
#     (so don't rename this file or the environment below)
#   - GitHub repo settings -> Environments -> "npm": add required reviewers
#     and restrict deployments to tags matching "v*"

name: Release

on:
  push:
    tags:
      - v*

# every job requests only the permissions it needs
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
      dist-tag: ${{ steps.package.outputs.dist-tag }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # full history, to check that the tag is on the default branch
        fetch-depth: 0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Read package metadata
      id: package
      run: |
        NAME="$(node -p "require('./package.json').name")"
        VERSION="$(node -p "require('./package.json').version")"
        # 1.2.3 -> latest, 1.2.3-beta.1 -> beta, 1.2.3-1 -> next
        DIST_TAG="$(node -p "const p = process.argv[1].split('-')[1]; p === undefined ? 'latest' : (/^[a-z]+/i.exec(p) || ['next'])[0]" "$VERSION")"
        {
          echo "name=$NAME"
          echo "version=$VERSION"
          echo "dist-tag=$DIST_TAG"
        } >> "$GITHUB_OUTPUT"
        echo "Releasing $NAME@$VERSION with dist-tag $DIST_TAG"

    - name: Check that the tag matches the package version
      env:
        VERSION: ${{ steps.package.outputs.version }}
      run: |
        if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version v$VERSION"
          exit 1
        fi

    - name: Check that the tag is on the default branch
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
          echo "::error::Tag $GITHUB_REF_NAME points to a commit that isn't on $DEFAULT_BRANCH"
          exit 1
        fi

    - name: Check that the version isn't published yet
      env:
        NAME: ${{ steps.package.outputs.name }}
        VERSION: ${{ steps.package.outputs.version }}
      run: |
        if OUTPUT="$(npm view "$NAME@$VERSION" version 2>&1)"; then
          if [ -n "$OUTPUT" ]; then
            echo "::error::$NAME@$VERSION is already published"
            exit 1
          fi
        elif ! echo "$OUTPUT" | grep -q E404; then
          # anything but "not found" (e.g. a network error) shouldn't be treated as "not published"
          echo "$OUTPUT"
          echo "::error::Couldn't check whether $NAME@$VERSION is published"
          exit 1
        fi

    - run: npm ci --ignore-scripts --no-audit --no-fund
    - run: npm run lint --if-present
    - run: npm run typecheck --if-present
    - run: npm run build --if-present
    - run: npm test
    - run: npm pack
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: package
        path: '*.tgz'
        if-no-files-found: error
        retention-days: 7

  # this job gets the OIDC token so it doesn't check out or install anything,
  # it only publishes the tarball built and tested by the job above
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ needs.build.outputs.name }}/v/${{ needs.build.outputs.version }}
    permissions:
      id-token: write # required for npm trusted publishing (OIDC)

    steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        package-manager-cache: false
        registry-url: 'https://registry.npmjs.org'
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: package
    # trusted publishing requires npm 11.5.1+, provenance attestations are generated automatically
    - name: Check npm version
      run: |
        npm --version
        node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); process.exit(major > 11 || major === 11 && (minor > 5 || minor === 5 && patch >= 1) ? 0 : 1)" "$(npm --version)"
    - name: Publish
      env:
        DIST_TAG: ${{ needs.build.outputs.dist-tag }}
      run: npm publish ./*.tgz --tag "$DIST_TAG"

  github-release:
    name: Create GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # required to create the release

    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: package
    - name: Create the release with the published tarball
      env:
        GH_TOKEN: ${{ github.token }}
        DIST_TAG: ${{ needs.build.outputs.dist-tag }}
      run: |
        PRERELEASE=()
        if [ "$DIST_TAG" != latest ]; then
          PRERELEASE=(--prerelease)
        fi
        gh release create "$GITHUB_REF_NAME" ./*.tgz \
          --repo "$GITHUB_REPOSITORY" \
          --title "$GITHUB_REF_NAME" \
          --generate-notes \
          --verify-tag \
          "${PRERELEASE[@]}"
